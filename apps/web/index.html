<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Learn American Sign Language with interactive 3D hands, structured lessons, and camera practice." />
    <meta name="theme-color" content="#0f172a" />
    <link rel="apple-touch-icon" href="/pwa-192.png" />
    <title>SignFlow — Learn ASL with 3D Hands</title>
    <!-- signflow-build v6 -->
    <script>
      (function () {
        try {
          if (!('serviceWorker' in navigator)) return;
          navigator.serviceWorker.getRegistrations().then(function (regs) {
            regs.forEach(function (reg) {
              var url =
                (reg.active && reg.active.scriptURL) ||
                (reg.waiting && reg.waiting.scriptURL) ||
                (reg.installing && reg.installing.scriptURL) ||
                '';
              if (/\/sw\.js$/.test(url)) void reg.unregister();
            });
          });
        } catch (err) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
